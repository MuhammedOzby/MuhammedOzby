<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Muhammed Mustafa Özbay — NOC ve sistem izleme</title>
  <desc id="desc">Kehribar gece paletinde, ağ, sistem ve olay sinyallerini tek bir bağlam noktasında birleştiren profil başlığı.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1724"/>
      <stop offset="1" stop-color="#122537"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop offset="0" stop-color="#d98f4e"/>
      <stop offset="1" stop-color="#f2c176"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#e0a562" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e0a562" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#8aa4ac" opacity=".19"/>
    </pattern>
    <clipPath id="rounded-edge"><rect width="1200" height="330" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="330" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="14" fill="url(#grid)"/>
  <path d="M0 0h10v330H0z" fill="url(#accent)" clip-path="url(#rounded-edge)"/>
  <path d="M60 280h610" stroke="#385362" stroke-width="1"/>
  <path d="M60 280h132" stroke="url(#accent)" stroke-width="2"/>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="60" y="65" font-size="12" font-weight="700" letter-spacing="3.5" fill="#e7ab67">MUHAMMED MUSTAFA ÖZBAY</text>
    <text x="57" y="149" font-size="54" font-weight="700" letter-spacing="-2" fill="#edf2f0">İzle. Anla.</text>
    <text x="57" y="215" font-size="54" font-weight="700" letter-spacing="-2" fill="url(#accent)">Müdahale et.</text>
    <text x="60" y="254" font-size="15" fill="#b9c9cc">Binlerce yol vardır; çözüm, koşullara en uygun olanı bulmaktır.</text>
    <text x="60" y="312" font-size="14" letter-spacing="2.2" fill="#b0c3c9">NOC  /  SİSTEM İZLEME  /  LINUX</text>
  </g>

  <path d="M711 47v236" stroke="#3b5966" stroke-width="1"/>
  <g fill="none" stroke="#547f86" stroke-width="2">
    <path d="M816 94h95l55 61"/>
    <path d="M816 165h150"/>
    <path d="M816 236h95l55-61"/>
  </g>
  <g fill="#0d202e" stroke="#71a6a5" stroke-width="2">
    <circle cx="816" cy="94" r="6"/>
    <circle cx="816" cy="165" r="6"/>
    <circle cx="816" cy="236" r="6"/>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="11" letter-spacing="1.8" fill="#9cb8bb">
    <text x="743" y="73">NETWORK</text>
    <text x="743" y="144">SYSTEMS</text>
    <text x="743" y="215">EVENTS</text>
  </g>

  <circle cx="1012" cy="165" r="141" fill="url(#halo)"/>
  <circle cx="1012" cy="165" r="83" fill="#102836" stroke="#416371" stroke-width="1"/>
  <circle cx="1012" cy="165" r="68" fill="none" stroke="#567e82" stroke-width="1" stroke-dasharray="2 7"/>
  <circle cx="1012" cy="165" r="45" fill="#142e3a" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="1012" cy="165" r="10" fill="#efb56d"/>
  <circle cx="1012" cy="165" r="20" fill="none" stroke="#efb56d" opacity=".42"/>
  <g font-family="DejaVu Sans Mono, monospace" font-size="10" letter-spacing="2" fill="#b8c8c8" text-anchor="middle">
    <text x="1012" y="270">BAĞLAM</text>
  </g>
  <path d="M1120 26h46M1120 304h46" stroke="#ae7a4e" opacity=".7"/>
</svg>
