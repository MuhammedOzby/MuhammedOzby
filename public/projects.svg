<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252" role="img" aria-labelledby="title desc">
  <title id="title">Açık çalışmalar: monitoring, syslog ve ağ laboratuvarı</title>
  <desc id="desc">Üç açık çalışmanın konularını temsil eden çizimler: metrik izleme, syslog akışı ve GNS3 ağ topolojisi.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1b29"/><stop offset="1" stop-color="#152c3a"/></linearGradient>
    <linearGradient id="amber" x2="1"><stop stop-color="#d78e4d"/><stop offset="1" stop-color="#f0bc75"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#8ba8af" opacity=".17"/></pattern>
  </defs>
  <rect width="1200" height="252" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="252" rx="14" fill="url(#dots)"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="35" y="32" font-size="11" font-weight="700" letter-spacing="2.5" fill="#e9ad68">AÇIK ÇALIŞMALAR / 03</text>
  </g>
  <g fill="#132a37" stroke="#4d707a">
    <rect x="35" y="52" width="360" height="168" rx="10"/>
    <rect x="420" y="52" width="360" height="168" rx="10"/>
    <rect x="805" y="52" width="360" height="168" rx="10"/>
  </g>
  <!-- Monitoring: chart and alert -->
  <g fill="none" stroke-width="2">
    <path d="M63 145h293M63 113h293M63 177h293" stroke="#315462"/>
    <path d="M65 162l42-15 37 9 39-43 37 19 38-26 37 7 47-39" stroke="url(#amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="346" cy="74" r="5" fill="#eeb36b" stroke="none"/>
  </g>
  <!-- Syslog: stream into database -->
  <g fill="none" stroke="#81aaa7" stroke-width="2">
    <path d="M460 116h71M460 139h55M460 162h71" stroke-linecap="round"/>
    <path d="M535 139h55" stroke="#e7a663"/>
    <path d="M586 133l11 6-11 6" stroke="#e7a663"/>
    <ellipse cx="663" cy="112" rx="42" ry="12"/>
    <path d="M621 112v57c0 7 19 13 42 13s42-6 42-13v-57M621 140c0 7 19 13 42 13s42-6 42-13"/>
    <path d="M621 169c0 7 19 13 42 13s42-6 42-13"/>
  </g>
  <!-- Network lab: switch and topology -->
  <g fill="none" stroke="#7fa9a8" stroke-width="2">
    <rect x="844" y="109" width="126" height="55" rx="8"/>
    <path d="M970 136h57M1027 136v-45M1027 136v45M1027 91h59M1027 181h59"/>
    <circle cx="1091" cy="91" r="7" fill="#e6a562" stroke="none"/>
    <circle cx="1091" cy="181" r="7" fill="#e6a562" stroke="none"/>
    <g fill="#70999a" stroke="none"><circle cx="864" cy="137" r="4"/><circle cx="881" cy="137" r="4"/><circle cx="898" cy="137" r="4"/><circle cx="915" cy="137" r="4"/><circle cx="932" cy="137" r="4"/><circle cx="949" cy="137" r="4"/></g>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#e0e9e7">
    <text x="63" y="202">01  Monitoring</text>
    <text x="448" y="202">02  Syslog → ClickHouse</text>
    <text x="833" y="202">03  Network Lab</text>
  </g>
</svg>
